                 has no room left at 320. Hidden until scripted: without
                 JavaScript the theme follows the system and this would do
                 nothing. -->
            <label class="theme-toggle" hidden>
                <span class="sr-only">Colour theme</span>
                <select id="theme-select" aria-label="Colour theme">
                    <option value="system">System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>

<script>
	// The control shows the PREFERENCE, not the theme in effect: with
	// "System" selected the page may well be dark, and the reader needs to
	// see that they chose "follow the system" rather than "dark".
	(function () {
		var sel = document.getElementById('theme-select');
		if (!sel) { return; }
		function apply(pref) {
			if (pref === 'light' || pref === 'dark') {
				document.documentElement.setAttribute('data-theme', pref);
			} else {
				document.documentElement.removeAttribute('data-theme');
			}
		}

		// Re-read here rather than trusting what the <head> applied: another
		// tab may have written between the two, and syncing only the control
		// would leave the label disagreeing with the page.
		var stored = null;
		try { stored = localStorage.getItem('vpm-theme'); } catch (e) { }
		if (stored === 'light' || stored === 'dark') {
			sel.value = stored;
			apply(stored);
		} else if (stored === null && !document.documentElement.hasAttribute('data-theme')) {
			sel.value = 'system';
		} else {
			// Storage became unreadable, or holds something we do not accept:
			// keep whatever is already on the page instead of contradicting it.
			sel.value = document.documentElement.getAttribute('data-theme') || 'system';
		}
		sel.closest('.theme-toggle').hidden = false;

		sel.addEventListener('change', function () {
			var pref = sel.value;
			// Apply first: if storage is unavailable the toggle must still
			// work for this page rather than silently doing nothing.
			apply(pref);
			try {
				if (pref === 'system') { localStorage.removeItem('vpm-theme'); }
				else { localStorage.setItem('vpm-theme', pref); }
			} catch (e) { }
		});

		// Keep tabs of the same site in step.
		window.addEventListener('storage', function (e) {
			if (e.storageArea !== window.localStorage) { return; }
			// A null key means another tab cleared the whole store, which
			// drops our preference too: fall back to the system like it did.
			if (e.key !== null && e.key !== 'vpm-theme') { return; }
			var v = e.key === null ? null : e.newValue;
			var pref = (v === 'light' || v === 'dark') ? v : 'system';
			sel.value = pref;
			apply(pref);
		});
	})();
</script>
