<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="description" content="" />
	<link rel="icon" href="/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>@ctx.title</title>
	<script>
		// Applied before the first paint, otherwise the page flashes the
		// default theme before the reader's choice lands. Only reads; the
		// toggle below does the writing. A blocked localStorage throws on
		// access, and the catch leaves us on the system preference, which is
		// also what a reader without JavaScript gets.
		(function () {
			try {
				var t = localStorage.getItem('vpm-theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) { }
		})();
	</script>
	@include 'assets/styles.html'
</head>

<body class="min-h-screen flex flex-col">
	<header class="site-header flex-shrink-0 flex justify-center items-center">
		<div class="px-6 w-header max-w-full min-w-0 flex gap-6 justify-between items-center">
			<div class="flex-1 flex items-center">
				<a class="clip-zero w-full md:w-16 lg:w-full" href="/">
					<svg xmlns="http://www.w3.org/2000/svg" width="145" height="64">
						<use href="#vpm_logo"></use>
					</svg>
				</a>
			</div>
			<div class="hidden md:flex basis-[36.25rem]">
				@include 'components/searchbar.html'
			</div>
			<div class="flex-1 flex justify-end items-center gap-7">
				<nav class="main-nav hidden lg:flex">
					<a href="/search">Browse</a>
					<a href="/new">Submit</a>
				</nav>

				@if !ctx.is_logged_in()
				<a class="button flex justify-center gap-2"
					rel="external" href="@app.login_link()" aria-label="Login with Github">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">
						<use href="#github_login_icon"></use>
					</svg>
					Login
				</a>
				@else
				<a href="/users/@ctx.cur_user.username">
					<img class="w-12 h-12 rounded-full" title="@ctx.cur_user.username" alt="@ctx.cur_user.username"
						src="https://github.com/@{ctx.cur_user.username}.png" />
				</a>
				@end
			</div>
		</div>
	</header>
	<div
		class="md:hidden top-0 sticky z-10 justify-center bg-surface h-fit py-2 px-4 border-b border-solid border-line">
		@include 'components/searchbar.html'
	</div>

	<main class="flex-1 w-full xl:w-page max-w-full min-w-0 p-4 md:p-6 flex flex-col gap-12 mx-auto md:pt-10">
